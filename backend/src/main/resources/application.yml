server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_web?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.blogweb: info

blog:
  main-user:
    id: 3
